<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body>
<div id="root"></div>

<!-- ===================== animation engine ===================== -->
<script type="text/babel" data-presets="react">
(function(){
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)

/* BEGIN USAGE */
// animations.jsx
// Reusable animation starter: Stage, Timeline, Sprite, easing helpers.
// Exports (to window): Stage, Sprite, PlaybackBar, TextSprite, ImageSprite, RectSprite,
//   useTime, useTimeline, useSprite, Easing, interpolate, animate, clamp.
//
// Usage (in an HTML file that loads React + Babel):
//
//   <Stage width={1280} height={720} duration={10} background="#f6f4ef">
//     <MyScene />
//   </Stage>
//
// <Stage> auto-scales to the viewport and provides the scrubber, play/pause,
// ←/→ seek, space, and 0-to-reset controls, and persists the playhead.
// Inside <Stage>, any child can call useTime() to read the current
// playhead (seconds). Or wrap content in <Sprite start={1} end={4}>...</Sprite>
// to only render during that window -- children receive a `localTime` and
// `progress` via the useSprite() hook. Use Easing + interpolate()/animate()
// for tweens; TextSprite / ImageSprite / RectSprite have built-in entry/exit.
// Build YOUR scenes by composing Sprites inside a Stage.
/* END USAGE */
// ─────────────────────────────────────────────────────────────────────────────

// ── Easing functions (hand-rolled, Popmotion-style) ─────────────────────────
// All easings take t ∈ [0,1] and return eased t ∈ [0,1] (may overshoot for back/elastic).
const Easing = {
  linear: (t) => t,

  // Quad
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),

  // Cubic
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),

  // Quart
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),

  // Expo
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },

  // Sine
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,

  // Back (overshoot)
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },

  // Elastic
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

// ── Core interpolation helpers ──────────────────────────────────────────────

// Clamp a value to [min, max]
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

// interpolate([0, 0.5, 1], [0, 100, 50], ease?) -> fn(t)
// Popmotion-style: linearly maps t across input keyframes to output values,
// with optional easing per segment (single fn or array of fns).
function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        const eased = easeFn(local);
        return output[i] + (output[i + 1] - output[i]) * eased;
      }
    }
    return output[output.length - 1];
  };
}

// animate({from, to, start, end, ease})(t) — simpler single-segment tween.
// Returns `from` before `start`, `to` after `end`.
function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

// ── Timeline context ────────────────────────────────────────────────────────

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });

const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

// ── Sprite ──────────────────────────────────────────────────────────────────
// Renders children only when the playhead is inside [start, end]. Provides
// a sub-context with `localTime` (seconds since start) and `progress` (0..1).
//
//   <Sprite start={2} end={5}>
//     {({ localTime, progress }) => <Thing x={progress * 100} />}
//   </Sprite>
//
// Or as a plain wrapper — children can call useSprite() themselves.

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;

  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration)
    ? clamp(localTime / duration, 0, 1)
    : 0;

  const value = { localTime, progress, duration, visible };

  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

// ── Sample sprite components ────────────────────────────────────────────────

// TextSprite: fades/slides text in on entry, holds, then fades out on exit.
// Props: text, x, y, size, color, font, entryDur, exitDur, align
function TextSprite({
  text,
  x = 0, y = 0,
  size = 48,
  color = '#111',
  font = 'Inter, system-ui, sans-serif',
  weight = 600,
  entryDur = 0.45,
  exitDur = 0.35,
  entryEase = Easing.easeOutBack,
  exitEase = Easing.easeInCubic,
  align = 'left',
  letterSpacing = '-0.01em',
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let ty = 0;

  if (localTime < entryDur) {
    const t = entryEase(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    ty = (1 - t) * 16;
  } else if (localTime > exitStart) {
    const t = exitEase(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    ty = -t * 8;
  }

  const translateX = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      transform: `translate(${translateX}, ${ty}px)`,
      opacity,
      fontFamily: font,
      fontSize: size,
      fontWeight: weight,
      color,
      letterSpacing,
      whiteSpace: 'pre',
      lineHeight: 1.1,
      willChange: 'transform, opacity',
    }}>
      {text}
    </div>
  );
}

// ImageSprite: scales + fades in; optional Ken Burns drift during hold.
function ImageSprite({
  src,
  x = 0, y = 0,
  width = 400, height = 300,
  entryDur = 0.6,
  exitDur = 0.4,
  kenBurns = false,
  kenBurnsScale = 1.08,
  radius = 12,
  fit = 'cover',
  placeholder = null, // {label: string} for striped placeholder
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutCubic(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    scale = 0.96 + 0.04 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInCubic(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = (kenBurns ? kenBurnsScale : 1) + 0.02 * t;
  } else if (kenBurns) {
    const holdSpan = exitStart - entryDur;
    const holdT = holdSpan > 0 ? (localTime - entryDur) / holdSpan : 0;
    scale = 1 + (kenBurnsScale - 1) * holdT;
  }

  const content = placeholder ? (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'repeating-linear-gradient(135deg, #e9e6df 0 10px, #dcd8cf 10px 20px)',
      color: '#6b6458',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 13,
      letterSpacing: '0.04em',
      textTransform: 'uppercase',
    }}>
      {placeholder.label || 'image'}
    </div>
  ) : (
    <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: fit, display: 'block' }} />
  );

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      borderRadius: radius,
      overflow: 'hidden',
      willChange: 'transform, opacity',
    }}>
      {content}
    </div>
  );
}

// RectSprite: simple rectangle that animates position/size/color via props.
// Useful demo primitive — takes a `render` fn for per-frame customization.
function RectSprite({
  x = 0, y = 0,
  width = 100, height = 100,
  color = '#111',
  radius = 8,
  entryDur = 0.4,
  exitDur = 0.3,
  render, // optional: (ctx) => style overrides
}) {
  const spriteCtx = useSprite();
  const { localTime, duration } = spriteCtx;
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutBack(clamp(localTime / entryDur, 0, 1));
    opacity = clamp(localTime / entryDur, 0, 1);
    scale = 0.4 + 0.6 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInQuad(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = 1 - 0.15 * t;
  }

  const overrides = render ? render(spriteCtx) : {};

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      background: color,
      borderRadius: radius,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      willChange: 'transform, opacity',
      ...overrides,
    }} />
  );
}


function Stage({
  width = 1280,
  height = 720,
  duration = 10,
  background = '#f6f4ef',
  fps = 60,
  loop = true,
  autoplay = true,
  persistKey = 'animstage',
  children,
}) {
  const [time, setTime] = React.useState(() => {
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);

  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  // Persist playhead
  React.useEffect(() => {
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey]);

  // Auto-scale to fit viewport
  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 0; // playback bar hidden
      const s = Math.min(
        el.clientWidth / width,
        (el.clientHeight - barH) / height
      );
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', measure);
    };
  }, [width, height]);

  // Animation loop
  React.useEffect(() => {
    if (!playing) {
      lastTsRef.current = null;
      return;
    }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      lastTsRef.current = null;
    };
  }, [playing, duration, loop]);

  // Keyboard: space = play/pause, ← → = seek
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        setPlaying(p => !p);
      } else if (e.code === 'ArrowLeft') {
        setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.code === 'ArrowRight') {
        setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.key === '0' || e.code === 'Home') {
        setTime(0);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;

  const ctxValue = React.useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  return (
    <div
      ref={stageRef}
      style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center',
        background: '#0f1829',
        fontFamily: 'Inter, system-ui, sans-serif',
      }}
    >
      {/* Canvas area — vertically centered in remaining space */}
      <div style={{
        flex: 1,
        width: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden',
        minHeight: 0,
      }}>
        <div
          ref={canvasRef}
          style={{
            width, height,
            background,
            position: 'relative',
            transform: `scale(${scale})`,
            transformOrigin: 'center',
            flexShrink: 0,
            boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
            overflow: 'hidden',
          }}
        >
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>

    </div>
  );
}

// ── Playback bar ────────────────────────────────────────────────────────────
// Play/pause, return-to-begin, scrub track, time display.
// Uses fixed-width time fields so layout doesn't thrash.

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const t = timeFromEvent(e);
    if (dragging) {
      onSeek(t);
    } else {
      onHover(t);
    }
  };

  const onTrackLeave = () => {
    if (!dragging) onHover(null);
  };

  const onTrackDown = (e) => {
    setDragging(true);
    const t = timeFromEvent(e);
    onSeek(t);
    onHover(null);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => {
      if (!trackRef.current) return;
      const t = timeFromEvent(e);
      onSeek(t);
    };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => {
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mousemove', onMove);
    };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${String(m).padStart(1, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  };

  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px',
      background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%',
      maxWidth: 680,
      alignSelf: 'center',

      borderRadius: 8,
      color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif',
      userSelect: 'none',
      flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>

      {/* Current time: fixed width so it doesn't thrash */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'right',
        color: '#f6f4ef',
      }}>
        {fmt(time)}
      </div>

      {/* Scrub track */}
      <div
        ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={onTrackLeave}
        onMouseDown={onTrackDown}
        style={{
          flex: 1,
          height: 22,
          position: 'relative',
          cursor: 'pointer',
          display: 'flex', alignItems: 'center',
        }}
      >
        <div style={{
          position: 'absolute',
          left: 0, right: 0, height: 4,
          background: 'rgba(255,255,255,0.12)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: 0, width: `${pct}%`, height: 4,
          background: 'oklch(72% 0.12 250)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: `${pct}%`, top: '50%',
          width: 12, height: 12,
          marginLeft: -6, marginTop: -6,
          background: '#fff',
          borderRadius: 6,
          boxShadow: '0 2px 4px rgba(0,0,0,0.4)',
        }}/>
      </div>

      {/* Duration: fixed width */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'left',
        color: 'rgba(246,244,239,0.55)',
      }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button
      onClick={onClick}
      title={title}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 6,
        color: '#f6f4ef',
        cursor: 'pointer',
        padding: 0,
        transition: 'background 120ms',
      }}
    >
      {children}
    </button>
  );
}


Object.assign(window, {

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

})();
</script>

<!-- ===================== scene ===================== -->
<script type="text/babel" data-presets="react">
(function(){
// scene.jsx — Elizabeth Hannan slate-blue hero motion
// Composes a seamless 10s editorial title sequence on deep navy.
// Reads the playhead from useTimeline() and drives every element from `time`
// so the state at t=0 matches t=10 (seamless loop).

const { useTimeline, Easing, clamp, interpolate } = window;

// ── palette (slate-blue variant, navy surface) ──────────────────────────────
const C = {
  navy:      '#0f1829',
  cream:     '#f5f2ec',
  creamDim:  'rgba(245,242,236,0.62)',
  slate:     '#4e6e8b',
  slateMid:  '#6d8ba6',
  slatePale: '#7a99b3',
  accent:    '#2b475f',
};
const SERIF = "'Playfair Display', Georgia, serif";
const MONO  = "'DM Mono', 'Courier New', monospace";

// ── tiny tween helpers ──────────────────────────────────────────────────────
const ramp = (t, a, b, ease = Easing.easeOutCubic) =>
  ease(clamp((t - a) / (b - a), 0, 1));

// opacity that rises across [inA,inB] and falls across [outA,outB]
const fadeIO = (t, inA, inB, outA, outB) =>
  Math.min(ramp(t, inA, inB), 1 - ramp(t, outA, outB, Easing.easeInCubic));

// masked line reveal: returns translateY in % (clipped by overflow:hidden parent)
function lineReveal(t, inA, inB, outA, outB) {
  const i = Easing.easeOutExpo(clamp((t - inA) / (inB - inA), 0, 1));
  const o = Easing.easeInCubic(clamp((t - outA) / (outB - outA), 0, 1));
  return (1 - i) * 118 + o * -118; // below → settle → above
}

// ── ambient: faint drifting motes (sinusoidal drift; gather to cursor on hover,
//    jiggle + follow, release back to ambient on click) ──────────────────────
const MOTE_COUNT = 66; // 3× the original ambient density
const MOTES = Array.from({ length: MOTE_COUNT }, (_, i) => {
  const r = (s) => { const x = Math.sin((i + 1) * s) * 10000; return x - Math.floor(x); };
  return {
    x: 60 + r(12.9) * 1480,
    y: 60 + r(78.2) * 680,
    s: 1 + r(3.3) * 2.2,
    amp: 8 + r(5.1) * 26,
    phase: r(9.7) * Math.PI * 2,
    speed: 1 + Math.floor(r(2.2) * 2), // 1 or 2 full cycles / 10s
    op: 0.12 + r(1.7) * 0.30,
    ga: r(4.4) * Math.PI * 2,         // gather angle around cursor
    gr: 22 + r(6.6) * 128,            // gather radius (loose cloud)
    jph: r(2.1) * Math.PI * 2,        // jiggle phase
  };
});

function Motes({ time }) {
  const g = fadeIO(time, 0.0, 1.4, 9.0, 10.0);
  const rootRef = React.useRef(null);
  const posRef = React.useRef(MOTES.map((m) => ({ x: m.x, y: m.y })));
  const ptr = React.useRef({ x: 800, y: 400, inside: false, released: false });

  React.useEffect(() => {
    const map = (e) => {
      const el = rootRef.current; if (!el) return null;
      const rc = el.getBoundingClientRect();
      return {
        x: ((e.clientX - rc.left) / rc.width) * 1600,
        y: ((e.clientY - rc.top) / rc.height) * 800,
        inside: e.clientX >= rc.left && e.clientX <= rc.right &&
                e.clientY >= rc.top && e.clientY <= rc.bottom,
      };
    };
    const onMove = (e) => {
      const p = map(e); if (!p) return;
      ptr.current.x = p.x; ptr.current.y = p.y;
      if (p.inside) { ptr.current.inside = true; ptr.current.released = false; }
      else { ptr.current.inside = false; }
    };
    const onDown = (e) => {
      const p = map(e); if (p && p.inside) ptr.current.released = true; // scatter back
    };
    const onLeave = () => { ptr.current.inside = false; ptr.current.released = false; };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerdown', onDown);
    window.addEventListener('pointerleave', onLeave);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerdown', onDown);
      window.removeEventListener('pointerleave', onLeave);
    };
  }, []);

  const following = ptr.current.inside && !ptr.current.released;
  const pos = posRef.current;

  return (
    <div ref={rootRef} style={{ position: 'absolute', inset: 0, opacity: g }}>
      {MOTES.map((m, k) => {
        // ambient sinusoidal drift target (unchanged motion)
        const ax = m.x + Math.cos((time / 10) * Math.PI * 2 * m.speed + m.phase) * m.amp * 0.4;
        const ay = m.y + Math.sin((time / 10) * Math.PI * 2 * m.speed + m.phase) * m.amp;
        let tx = ax, ty = ay, k2 = 0.045;
        if (following) {
          const j = 6; // giggle
          tx = ptr.current.x + Math.cos(m.ga) * m.gr + Math.sin(time * 9 + m.jph) * j;
          ty = ptr.current.y + Math.sin(m.ga) * m.gr + Math.cos(time * 9 + m.jph) * j;
          k2 = 0.14;
        }
        const s = pos[k];
        s.x += (tx - s.x) * k2;
        s.y += (ty - s.y) * k2;
        return (
          <div key={k} style={{
            position: 'absolute', left: s.x, top: s.y,
            width: m.s, height: m.s, borderRadius: '50%',
            background: C.slatePale, opacity: m.op,
          }} />
        );
      })}
    </div>
  );
}

// ── ambient: slow orbit motif, exactly one turn / 10s (seamless) ────────────
function Orbit({ time, accent = C.slateMid }) {
  const g = fadeIO(time, 0.2, 1.8, 9.0, 10.0) * 0.9;
  const rot = (time / 10) * 360;
  const cx = 1232, cy = 408;
  const ring = (d, w, op, dir) => (
    <div style={{
      position: 'absolute', left: cx - d / 2, top: cy - d / 2,
      width: d, height: d, borderRadius: '50%',
      border: `1px solid ${accent}`, opacity: op,
    }} />
  );
  return (
    <div style={{ position: 'absolute', inset: 0, opacity: g }}>
      {ring(640, 1, 0.22)}
      {ring(470, 1, 0.30)}
      {/* rotating arc + node */}
      <div style={{
        position: 'absolute', left: cx, top: cy, width: 0, height: 0,
        transform: `rotate(${rot}deg)`,
      }}>
        <div style={{
          position: 'absolute', left: 235 - 4, top: -4, width: 8, height: 8,
          borderRadius: '50%', background: accent,
          boxShadow: `0 0 14px ${accent}`,
        }} />
      </div>
      <div style={{
        position: 'absolute', left: cx, top: cy, width: 0, height: 0,
        transform: `rotate(${-rot * 1.6 + 140}deg)`,
      }}>
        <div style={{
          position: 'absolute', left: 320 - 2.5, top: -2.5, width: 5, height: 5,
          borderRadius: '50%', background: C.slatePale, opacity: 0.85,
        }} />
      </div>
    </div>
  );
}

// ── focus areas: editorial cross-fade scroller (01–05) ──────────────────────
const FOCUS = [
  'AI Safety',
  'ESG Transparency',
  'Accessibility Technology',
  'Hax – Human AI Experience',
  'Turning Complexity Into Clarity',
];

function FocusList({ time }) {
  const block = fadeIO(time, 2.6, 3.0, 8.5, 9.0);
  const start = 2.9, per = 1.12;
  return (
    <div style={{ position: 'absolute', left: 184, top: 536, height: 44, opacity: block }}>
      {FOCUS.map((label, i) => {
        const s = start + i * per;
        const inO = Easing.easeOutCubic(clamp((time - s) / 0.38, 0, 1));
        const outO = Easing.easeInCubic(clamp((time - (s + per - 0.30)) / 0.38, 0, 1));
        const op = Math.min(inO, 1 - outO);
        if (op <= 0.001) return null;
        const ty = (1 - inO) * 16 + outO * -14;
        return (
          <div key={i} style={{ position: 'absolute', left: 0, top: 0,
            transform: `translateY(${ty}px)`, opacity: op, whiteSpace: 'nowrap' }}>
            <span style={{ position: 'absolute', left: -50, top: 3, fontFamily: MONO,
              fontSize: 13, letterSpacing: '0.14em', color: C.slatePale, fontWeight: 400 }}>{`0${i + 1}`}</span>
            <span style={{ fontFamily: MONO, fontSize: 21, letterSpacing: '0.02em',
              color: C.cream, textTransform: 'uppercase', fontWeight: 400 }}>{label}</span>
          </div>
        );
      })}
    </div>
  );
}

// ── main scene ──────────────────────────────────────────────────────────────
function HeroScene({
  name = 'Elizabeth Hannan',
  accent = C.slateMid,
  surface = C.navy,
  kickerL = 'CAREER PORTFOLIO · TECHNICAL INSTRUCTION · Engineering Leadership',
  kickerR = 'Featured Work',
  footL = 'Researcher · AI Writer · Polymath',
  footR = 'Scroll to enter',
} = {}) {
  const { time } = useTimeline();

  // split the name: all but last word on line 1, last word italic on line 2
  const words = String(name).trim().split(/\s+/);
  const line1 = words.length > 1 ? words.slice(0, -1).join(' ') : words[0] || '';
  const line2 = words.length > 1 ? words[words.length - 1] : '';
  const nameSize = line1.length > 10 ? 62 : 75; // half of the original treatment

  // top eyebrow row + hairline
  const topOp = fadeIO(time, 0.3, 1.3, 8.7, 9.7);
  const ruleW = ramp(time, 0.5, 1.6, Easing.easeInOutCubic) * (1 - ramp(time, 8.7, 9.6, Easing.easeInCubic));

  // name lines
  const l1 = lineReveal(time, 0.75, 2.0, 8.45, 9.6);
  const l2 = lineReveal(time, 1.05, 2.35, 8.2, 9.35);

  // animated divider lines + discipline title + numbered label
  const uA = ramp(time, 1.55, 2.55, Easing.easeInOutCubic) * (1 - ramp(time, 8.4, 9.4, Easing.easeInCubic));
  const uB = ramp(time, 1.95, 2.95, Easing.easeInOutCubic) * (1 - ramp(time, 8.3, 9.3, Easing.easeInCubic));
  const titleOp = fadeIO(time, 2.0, 2.7, 8.3, 9.2);
  const titleTY = (1 - ramp(time, 2.0, 2.7)) * 14 + ramp(time, 8.3, 9.2, Easing.easeInCubic) * -10;

  // bottom timeline progress (fill snaps at loop, hidden behind fade)
  const tlOp = fadeIO(time, 0.0, 0.8, 9.2, 10.0);
  const tlFill = clamp(time / 10, 0, 1);

  const LX = 184;            // content left
  const RX = 1416;           // content right

  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', background: surface }}>
      {/* depth glow */}
      <div style={{
        position: 'absolute', left: 120, top: 120, width: 980, height: 620,
        background: `radial-gradient(60% 60% at 30% 40%, rgba(78,110,139,0.20), rgba(15,24,41,0) 70%)`,
      }} />
      {/* vignette */}
      <div style={{
        position: 'absolute', inset: 0,
        background: `radial-gradient(120% 120% at 50% 45%, rgba(15,24,41,0) 55%, rgba(7,12,22,0.55) 100%)`,
      }} />

      <Motes time={time} />
      <Orbit time={time} accent={accent} />

      {/* left structural hairline */}
      <div style={{
        position: 'absolute', left: LX - 0.5, top: 96, width: 1, height: 632,
        background: 'rgba(122,153,179,0.16)',
      }} />

      {/* eyebrow row */}
      <div style={{ position: 'absolute', left: LX, top: 110, right: 1600 - RX, opacity: topOp,
        display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span style={{ fontFamily: MONO, fontSize: 13, letterSpacing: '0.22em',
          textTransform: 'uppercase', color: C.slatePale, whiteSpace: 'nowrap' }}>{kickerL}</span>
        <span style={{ fontFamily: MONO, fontSize: 13, letterSpacing: '0.22em',
          textTransform: 'uppercase', color: C.creamDim, whiteSpace: 'nowrap' }}>{kickerR}</span>
      </div>
      {/* eyebrow hairline */}
      <div style={{ position: 'absolute', left: LX, top: 150, height: 1,
        width: (RX - LX) * ruleW, background: 'rgba(213,207,197,0.30)',
        transformOrigin: 'left' }} />

      {/* name (half scale) */}
      <div style={{ position: 'absolute', left: LX, top: line2 ? 192 : 250 }}>
        <div style={{ overflow: 'hidden', height: nameSize * 1.12 }}>
          <div style={{ transform: `translateY(${l1}%)`,
            fontFamily: SERIF, fontWeight: 400, fontSize: nameSize, lineHeight: 1.06,
            letterSpacing: '-0.02em', color: C.slatePale, whiteSpace: 'nowrap' }}>{line1}</div>
        </div>
        {line2 ? (
          <div style={{ overflow: 'hidden', height: nameSize * 1.15, marginTop: -6 }}>
            <div style={{ transform: `translateY(${l2}%)`,
              fontFamily: SERIF, fontWeight: 400, fontStyle: 'italic', fontSize: nameSize,
              lineHeight: 1.06, letterSpacing: '-0.02em', color: C.cream, whiteSpace: 'nowrap' }}>{line2}</div>
          </div>
        ) : null}
      </div>

      {/* animated divider line A */}
      <div style={{ position: 'absolute', left: LX, top: 398, height: 1.5,
        width: 560 * uA, background: accent, transformOrigin: 'left' }} />
      <div style={{ position: 'absolute', left: LX + 560 * uA - 3, top: 398 - 2.5,
        width: 5, height: 5, borderRadius: '50%', background: C.slatePale, opacity: uA }} />

      {/* discipline title */}
      <div style={{ position: 'absolute', left: LX, top: 422, opacity: titleOp,
        transform: `translateY(${titleTY}px)`, fontFamily: SERIF, fontStyle: 'italic',
        fontWeight: 400, fontSize: 42, lineHeight: 1.1, letterSpacing: '-0.01em',
        color: C.cream, whiteSpace: 'nowrap' }}>Technical Instructional Design</div>

      {/* animated divider line B (the original rule) */}
      <div style={{ position: 'absolute', left: LX, top: 512, height: 1.5,
        width: 560 * uB, background: accent, transformOrigin: 'left' }} />
      <div style={{ position: 'absolute', left: LX + 560 * uB - 3, top: 512 - 2.5,
        width: 5, height: 5, borderRadius: '50%', background: C.slatePale, opacity: uB }} />

      {/* animated cross-fade scroller (01–05) */}
      <FocusList time={time} />

      {/* bottom timeline */}
      <div style={{ position: 'absolute', left: LX, right: 1600 - RX, top: 724, opacity: tlOp }}>
        <div style={{ position: 'relative', height: 2, background: 'rgba(122,153,179,0.18)' }}>
          <div style={{ position: 'absolute', left: 0, top: 0, height: 2,
            width: `${tlFill * 100}%`, background: accent }} />
          <div style={{ position: 'absolute', left: `${tlFill * 100}%`, top: -2.5,
            width: 7, height: 7, marginLeft: -3.5, borderRadius: '50%',
            background: C.cream }} />
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 12 }}>
          <span style={{ fontFamily: MONO, fontSize: 12, letterSpacing: '0.16em',
            color: C.creamDim, textTransform: 'uppercase', whiteSpace: 'nowrap' }}>{footL}</span>
          <span style={{ fontFamily: MONO, fontSize: 12, letterSpacing: '0.16em',
            color: C.creamDim, textTransform: 'uppercase', whiteSpace: 'nowrap' }}>{footR}</span>
        </div>
      </div>
    </div>
  );
}

window.HeroScene = HeroScene;

})();
</script>

<script type="text/babel" data-presets="react">
(function(){

  const { Stage, useTweaks, TweaksPanel, TweakSection, TweakText, TweakRadio, TweakColor } = window;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "name": "Elizabeth Hannan",
    "surface": "#0f1829",
    "accent": "#7a99b3",
    "pace": "Default"
  }/*EDITMODE-END*/;

  const PACE_DURATION = { Calm: 13, Default: 10, Lively: 7.5 };

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const duration = PACE_DURATION[t.pace] || 10;

    return (
      <React.Fragment>
        <Stage
          key={duration}
          width={1600}
          height={800}
          duration={duration}
          background={t.surface}
          loop={true}
          autoplay={true}
          persistKey="hannan-hero"
        >
          <HeroScene name={t.name} accent={t.accent} surface={t.surface} />
        </Stage>

        <TweaksPanel title="Tweaks">
          <TweakSection label="Content" />
          <TweakText label="Name" value={t.name}
                     onChange={(v) => setTweak('name', v)} />
          <TweakSection label="Motion" />
          <TweakRadio label="Pace" value={t.pace}
                      options={['Calm', 'Default', 'Lively']}
                      onChange={(v) => setTweak('pace', v)} />
          <TweakSection label="Palette" />
          <TweakColor label="Surface" value={t.surface}
                      options={['#0f1829', '#16283b', '#0b1018']}
                      onChange={(v) => setTweak('surface', v)} />
          <TweakColor label="Accent" value={t.accent}
                      options={['#6d8ba6', '#7a99b3', '#4e6e8b', '#8fb0c9']}
                      onChange={(v) => setTweak('accent', v)} />
        </TweaksPanel>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);

})();
</script>
