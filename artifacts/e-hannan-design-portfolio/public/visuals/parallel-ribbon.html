<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallel Ribbon</title>
<style>
  :root { --bg: #0A1A5C; --mint: #3EE8C4; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .rec { fill: none; stroke-linecap: round; transition: opacity .9s ease, stroke .9s ease, stroke-width .9s ease; }
  .brush { filter: drop-shadow(0 0 8px rgba(62,232,196,.55)); }
</style>
</head>
<body>
<svg id="art" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Parallel coordinates: woven lines cross seven axes while a glowing selection slides along the middle axis">
  <g id="lines"></g>
  <g id="axes"></g>
  <rect id="brush" class="brush" x="0" y="0" width="24" height="0" rx="4" fill="#3EE8C4" fill-opacity="0.16" stroke="#3EE8C4" stroke-width="1.5"/>
</svg>

<script>
(() => {
  // ---- settings ----
  const SPEED = 1;         // 1 = default; lower is slower
  const RECORDS = 90;      // number of lines
  const AXES = 7;
  const BRUSH_AXIS = 3;    // which axis the selection slides on (0-based)
  const BRUSH_SIZE = 0.1;  // half-height of the selection (0–0.5)
  const MINT = '#3EE8C4';
  const GROUP_COLORS = ['#9BD6FF', '#B8A6FF', '#7CF5D8'];

  const NS = 'http://www.w3.org/2000/svg';
  const r = (v) => Math.round(v * 10) / 10;
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };

  const X = [];
  for (let k = 0; k < AXES; k++) X.push(160 + k * (1120 / (AXES - 1)));
  const Y = (v) => 110 + (1 - v) * 680;

  // axes
  const axesG = document.getElementById('axes');
  for (const x of X) {
    el('line', { x1: x, x2: x, y1: 110, y2: 790, stroke: MINT, opacity: 0.45 }, axesG);
    el('line', { x1: x - 5, x2: x + 5, y1: 110, y2: 110, stroke: MINT, opacity: 0.45 }, axesG);
    el('line', { x1: x - 5, x2: x + 5, y1: 790, y2: 790, stroke: MINT, opacity: 0.45 }, axesG);
  }

  // records: three bundles that weave across the axes like a ribbon
  let seed = 9;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const lineG = document.getElementById('lines');
  const recs = [];
  for (let i = 0; i < RECORDS; i++) {
    const g = i % 3, ph = [0, 2.1, 4.2][g], amp = [0.32, 0.28, 0.3][g];
    const vals = [];
    for (let k = 0; k < AXES; k++) vals.push(Math.max(0.02, Math.min(0.98, 0.5 + amp * Math.sin(k * 0.95 + ph) + (rand() - 0.5) * 0.16)));
    let d = `M-40,${r(Y(vals[0]))} L${X[0]},${r(Y(vals[0]))}`;
    for (let k = 0; k < AXES - 1; k++) {
      const xm = (X[k] + X[k + 1]) / 2;
      d += ` C${r(xm)},${r(Y(vals[k]))} ${r(xm)},${r(Y(vals[k + 1]))} ${X[k + 1]},${r(Y(vals[k + 1]))}`;
    }
    d += ` L1480,${r(Y(vals[AXES - 1]))}`;
    recs.push({ vals, g, on: null, node: el('path', { class: 'rec', d }, lineG) });
  }

  const brush = document.getElementById('brush');
  brush.setAttribute('x', X[BRUSH_AXIS] - 12);

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speed = reduce ? SPEED * 0.35 : SPEED;
  let time = 0, last = performance.now();

  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    time += (dt / 1000) * speed;
    const c = 0.5 + 0.34 * Math.sin(time * 0.22);
    const lo = c - BRUSH_SIZE, hi = c + BRUSH_SIZE;
    brush.setAttribute('y', r(Y(hi)));
    brush.setAttribute('height', r(Y(lo) - Y(hi)));
    for (const rec of recs) {
      const on = rec.vals[BRUSH_AXIS] >= lo && rec.vals[BRUSH_AXIS] <= hi;
      if (on !== rec.on) { // only touch the DOM when a line's state changes
        rec.on = on;
        rec.node.setAttribute('stroke', on ? MINT : GROUP_COLORS[rec.g]);
        rec.node.setAttribute('stroke-width', on ? 1.8 : 1);
        rec.node.setAttribute('opacity', on ? 0.95 : 0.16);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
