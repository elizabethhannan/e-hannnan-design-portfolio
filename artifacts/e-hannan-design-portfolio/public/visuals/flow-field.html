<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Field</title>
<style>
  :root { --bg: #0A1A5C; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .trail { fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .head { filter: drop-shadow(0 0 5px currentColor); }
</style>
</head>
<body>
<svg id="art" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Particles drift along an invisible flowing field, leaving short fading trails">
  <g id="trails"></g>
  <g id="heads"></g>
</svg>

<script>
(() => {
  // ---- settings ----
  const SPEED = 1;        // 1 = default; lower is slower
  const PARTICLES = 240;  // 80–400
  const TRAIL = 18;       // trail length in steps
  const MINT = '#3EE8C4';
  const color = (k) => k < 0.55 ? MINT : k < 0.75 ? '#2DD4BF' : k < 0.88 ? '#9BD6FF' : k < 0.96 ? '#A8FFE6' : '#B8A6FF';

  const NS = 'http://www.w3.org/2000/svg';
  const r = (v) => Math.round(v * 10) / 10;
  let seed = 3;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };

  const trailG = document.getElementById('trails'), headG = document.getElementById('heads');
  const ps = [];

  function spawn(p, anywhere) {
    p.x = anywhere ? rand() * 1440 : -10;
    p.y = rand() * 900;
    p.trail = []; p.age = 0; p.life = 160 + rand() * 260;
    p.kind = rand(); p.op = 0.25 + rand() * 0.6;
    if (p.node) p.node.setAttribute('stroke', color(p.kind));
  }

  for (let i = 0; i < PARTICLES; i++) {
    const p = {};
    spawn(p, true);
    p.age = Math.floor(rand() * 120);
    p.node = el('polyline', { class: 'trail', stroke: color(p.kind) }, trailG);
    if (i % 10 === 0) {
      const c = i % 20 ? '#E6FFF8' : '#B8A6FF';
      p.head = el('circle', { class: 'head', r: 2.4, fill: c, style: `color:${c}` }, headG);
    }
    ps.push(p);
  }

  let time = 0;
  function step(k) {
    const t = time;
    for (const p of ps) {
      // the invisible field: a blend of slow sine waves that drifts over time
      const a = Math.sin(p.x * 0.0032 + t * 0.15) * 1.3 + Math.cos(p.y * 0.0047 - t * 0.11) * 1.1 + Math.sin((p.x + p.y) * 0.0016 + t * 0.07) * 0.6;
      p.x += Math.cos(a) * 1.9 * k + 0.6 * k;
      p.y += Math.sin(a) * 1.9 * k;
      p.trail.push(r(p.x) + ',' + r(p.y));
      if (p.trail.length > TRAIL) p.trail.shift();
      p.age++;
      if (p.age > p.life || p.x > 1460 || p.y < -20 || p.y > 920) spawn(p, false);
    }
  }
  for (let i = 0; i < 40; i++) step(1); // pre-run so trails exist on first frame

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speed = reduce ? SPEED * 0.35 : SPEED;
  let last = performance.now();

  function frame(now) {
    const dt = Math.max(0, Math.min(50, now - last)); last = now;
    time += (dt / 1000) * speed;
    step(speed);
    for (const p of ps) {
      const fade = Math.max(0, Math.min(1, p.age / 30, (p.life - p.age) / 30));
      if (p.trail.length > 1) {
        p.node.setAttribute('points', p.trail.join(' '));
        p.node.setAttribute('opacity', r(p.op * fade * 100) / 100);
      } else p.node.setAttribute('opacity', 0);
      if (p.head) {
        const [x, y] = (p.trail[p.trail.length - 1] || '0,0').split(',');
        p.head.setAttribute('cx', x); p.head.setAttribute('cy', y);
        p.head.setAttribute('opacity', r(fade * 100) / 100);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
