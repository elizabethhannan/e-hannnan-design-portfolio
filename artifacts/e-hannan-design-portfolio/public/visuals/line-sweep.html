<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Chart Sweep</title>
<style>
  :root { --bg: #0A1A5C; --mint: #3EE8C4; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .series { fill: none; stroke-width: 1.3; stroke-linecap: round; }
  .grid { stroke-dasharray: 2 6; }
  .dot { filter: drop-shadow(0 0 6px currentColor); }
</style>
</head>
<body>
<svg id="art" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animated line chart: rising lines with a cursor sweeping across">
  <defs>
    <linearGradient id="lc-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#118C96"/>
      <stop offset="0.6" stop-color="#3EE8C4"/>
      <stop offset="1" stop-color="#C9FFF0"/>
    </linearGradient>
  </defs>
  <g id="axes"></g>
  <g id="series"></g>
  <line id="cursor" x1="0" y1="90" x2="0" y2="800" stroke="#E6FFF8" stroke-width="1" opacity="0.55"/>
  <g id="dots"></g>
</svg>

<script>
(() => {
  // ---- settings ----
  const SPEED = 1;          // 1 = default; lower is slower
  const SWEEP_SECONDS = 25; // time for the cursor to cross the chart
  const MINT = '#3EE8C4', BG = '#0A1A5C';
  const DOT_COLORS = ['#E6FFF8', '#B8A6FF', MINT, '#9BD6FF'];
  const N = 24, SAMPLES = 50;
  const LEFT = 120, RIGHT = 1360, BOTTOM = 800;

  const NS = 'http://www.w3.org/2000/svg';
  const r = (v) => Math.round(v * 10) / 10;
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };

  // each series: a logistic rise with a gentle wobble (u = 0..1 across the screen)
  function fn(i, u) {
    const g = 140 + ((i * 37) % 24) / 24 * 520;
    const m = 0.38 + ((i * 11) % 24) / 24 * 0.35;
    const w = 0.07 + ((i * 5) % 7) / 7 * 0.08;
    const sig = 1 / (1 + Math.exp(-(u - m) / w));
    return 770 - g * sig - Math.sin(u * (7 + (i % 4)) + i) * 14 * u;
  }

  // smooth path through points (Catmull-Rom -> cubic Bezier)
  function smooth(P) {
    let d = `M${r(P[0][0])},${r(P[0][1])}`;
    for (let k = 0; k < P.length - 1; k++) {
      const p0 = P[Math.max(0, k - 1)], p1 = P[k], p2 = P[k + 1], p3 = P[Math.min(P.length - 1, k + 2)];
      d += ` C${r(p1[0] + (p2[0] - p0[0]) / 6)},${r(p1[1] + (p2[1] - p0[1]) / 6)} ${r(p2[0] - (p3[0] - p1[0]) / 6)},${r(p2[1] - (p3[1] - p1[1]) / 6)} ${r(p2[0])},${r(p2[1])}`;
    }
    return d;
  }

  // axes + grid
  const axes = document.getElementById('axes');
  for (let k = 0; k < 6; k++) el('line', { class: 'grid', x1: LEFT, x2: RIGHT, y1: 140 + k * 110, y2: 140 + k * 110, stroke: MINT, opacity: 0.18 }, axes);
  el('line', { x1: LEFT, x2: RIGHT, y1: BOTTOM, y2: BOTTOM, stroke: MINT, opacity: 0.4 }, axes);
  for (let k = 0; k <= 12; k++) {
    const x = LEFT + k * ((RIGHT - LEFT) / 12);
    el('line', { x1: x, x2: x, y1: BOTTOM, y2: BOTTOM + 8, stroke: MINT, opacity: 0.5 }, axes);
  }

  // series (drawn once)
  const series = document.getElementById('series');
  for (let i = 0; i < N; i++) {
    const P = [];
    for (let j = 0; j <= SAMPLES; j++) { const u = j / SAMPLES; P.push([-40 + u * 1520, fn(i, u)]); }
    el('path', { class: 'series', d: smooth(P), stroke: 'url(#lc-grad)', opacity: r((0.3 + 0.6 * Math.abs(Math.sin(i * 2.1))) * 100) / 100 }, series);
  }

  // cursor dots (on every 3rd series)
  const dotsG = document.getElementById('dots');
  const dots = [];
  for (let i = 1; i < N; i += 3) {
    const c = DOT_COLORS[((i / 3) | 0) % DOT_COLORS.length];
    dots.push({ i, node: el('circle', { class: 'dot', r: 4, fill: BG, stroke: c, 'stroke-width': 2, style: `color:${c}` }, dotsG) });
  }
  const cursor = document.getElementById('cursor');

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speed = reduce ? SPEED * 0.35 : SPEED;
  let time = 0, last = performance.now();

  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    time += (dt / 1000) * speed;
    const p = (time / SWEEP_SECONDS) % 1;
    const cx = LEFT + p * (RIGHT - LEFT);
    const u = (cx + 40) / 1520;
    cursor.setAttribute('x1', r(cx)); cursor.setAttribute('x2', r(cx));
    for (const d of dots) { d.node.setAttribute('cx', r(cx)); d.node.setAttribute('cy', r(fn(d.i, u))); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
